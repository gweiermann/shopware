packages:
  - packages/administration
  - packages/storefront
  - packages/acceptance-test-suite
  - packages/meteor
  - packages/meteor/packages/*
  - src/Storefront/Resources/app/administration
  - tests/acceptance

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - core-js
  - esbuild
  - unrs-resolver
  - vue-demi

overrides:
  "parse-url>@types/parse-path": "-"
  "vue@^3.0.0": 3.5.22
  "@vue/compiler-core@^3.0.0": 3.5.22
  "@vue/compiler-dom@^3.0.0": 3.5.22
  "@vue/compiler-sfc@^3.0.0": 3.5.22
  "@vue/compiler-ssr@^3.0.0": 3.5.22
  "@vue/reactivity@^3.0.0": 3.5.22
  "@vue/runtime-core@^3.0.0": 3.5.22
  "@vue/runtime-dom@^3.0.0": 3.5.22
  "@vue/server-renderer@^3.0.0": 3.5.22
  "@vue/shared@^3.0.0": 3.5.22

patchedDependencies:
  eslint-plugin-vue@10.10.0: patches/eslint-plugin-vue@10.10.0.patch
  jest-expect-message@1.1.3: patches/jest-expect-message@1.1.3.patch
  vue-eslint-parser@10.4.1: patches/vue-eslint-parser@10.4.1.patch
  tiny-slider@2.9.4: patches/tiny-slider@2.9.4.patch

# Meteor and the Administration were both built on flat node_modules and still import
# undeclared dependencies, so everything is also hoisted to the root node_modules.
# Each package keeps its direct dependencies in its own node_modules.
shamefullyHoist: true
