name: Setup JS workspace
description: Installs the pnpm workspace and builds the workspace packages the given package depends on

inputs:
  build-dependencies-of:
    description: Workspace package name whose workspace dependencies are built with turbo, e.g. `administration`. Empty skips the build.
    required: false
    default: ''
  node-version:
    description: Node.js version
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install workspace
      shell: bash
      env:
        PUPPETEER_SKIP_DOWNLOAD: 'true'
        LEFTHOOK: '0'
      run: pnpm install --frozen-lockfile

    - name: Cache turbo
      if: inputs.build-dependencies-of != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ inputs.build-dependencies-of }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.build-dependencies-of }}-

    - name: Build workspace dependencies
      if: inputs.build-dependencies-of != ''
      shell: bash
      env:
        TARGET: ${{ inputs.build-dependencies-of }}
      run: pnpm turbo run build --cache-dir=.turbo --filter="${TARGET}^..."
