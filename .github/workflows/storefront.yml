name: Storefront checks and tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  markdown-only-changes:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        uses: ./.github/actions/markdown-only-changes

  lint:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          mysql-version: skip
          npm-version: 11.8.0
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Setup JS workspace
        uses: ./.github/actions/setup-js-workspace

      - name: Cache ESLint and Stylelint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/storefront/node_modules/.eslintcache
            packages/storefront/node_modules/.stylelintcache
          key: storefront-lint-${{ runner.os }}-6.6

      - name: Check Code
        working-directory: packages/storefront
        run: |
          pnpm run lint:js
          pnpm run lint:scss

      - name: Lint snippets
        run: composer storefront:lint:snippets

  lint-admin-modules:
    name: "Storefront admin-modules code style"
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          mysql-version: skip
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Setup JS workspace
        uses: ./.github/actions/setup-js-workspace

      - name: Cache ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/Storefront/Resources/app/administration/.eslintcache
          key: storefront-admin-modules-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/administration/eslint.config.ts') }}

      - name: Lint
        run: composer eslint:storefront:admin-modules

      - name: Format
        working-directory: src/Storefront/Resources/app/administration
        run: npm run format

  twig-lint-storefront:
    name: Twig Lint (Storefront)
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ludtwig
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.13.0 --repo MalteJanz/ludtwig  --pattern '*unknown-linux-gnu.tar.gz' && tar xf ./*.tar.gz
          mv ./ludtwig /usr/local/bin

      - name: Run ludtwig linter
        id: ludtwigStep
        run: |
          cd ./src/Storefront/Resources/views
          ludtwig .

      - name: Instructions if ludtwig fails
        if: ${{ failure() && steps.ludtwigStep.outcome == 'failure'}}
        run: |
          ludtwig --version
          echo "If you want to run this locally install https://github.com/MalteJanz/ludtwig in the version above"
          echo "And then composer run ludtwig:storefront or ludtwig:storefront:fix"
          echo "Alternatively you also can run these in the DevEnv shell"
          exit "$status"  # Fail the job if ludtwig . failed

  jest:
    name: "Jest Storefront"
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    env:
      APP_ENV: prod
      APP_URL: http://localhost:8000
      APP_SECRET: def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48
      OPENSEARCH_URL: elasticsearch:9200
      ADMIN_OPENSEARCH_URL: elasticsearch:9200
      BLUE_GREEN_DEPLOYMENT: 1
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          mysql-version: skip
          npm-version: 11.8.0
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Setup JS workspace
        uses: ./.github/actions/setup-js-workspace

      - name: Run Jest Storefront
        working-directory: packages/storefront
        run: pnpm run unit --silent

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/storefront/build/artifacts/jest/cobertura-coverage.xml
          flags: jest-storefront
          disable_search: true
          disable_file_fixes: true

  vitest:
    name: "Vitest Storefront Components"
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    env:
      APP_ENV: prod
      APP_URL: http://localhost:8000
      APP_SECRET: def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48
      OPENSEARCH_URL: elasticsearch:9200
      ADMIN_OPENSEARCH_URL: elasticsearch:9200
      BLUE_GREEN_DEPLOYMENT: 1
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          mysql-version: skip
          npm-version: 11.8.0
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Setup JS workspace
        uses: ./.github/actions/setup-js-workspace

      - name: Run Vitest Storefront components with coverage
        working-directory: packages/storefront
        run: |
          pnpm run build:components
          pnpm run unit:components:coverage --coverage.reporter=cobertura --coverage.reportsDirectory=build/artifacts/vitest

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: packages/storefront/build/artifacts/vitest/cobertura-coverage.xml
          flags: vitest-storefront-components
          disable_search: true
          disable_file_fixes: true

  license-check:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    name: "License check"
    env:
      WHITELISTED_JS_PACKAGES: "abab@2.0.1;administration;taffydb@2.6.2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JS workspace
        uses: ./.github/actions/setup-js-workspace
      - name: Check license
        working-directory: packages/storefront
        run: |
          npx license-checker-rseidelsohn \
            --onlyAllow "$(tr \\n \; < ${{ github.workspace }}/.allowed-licenses)" \
            --excludePackages "${WHITELISTED_JS_PACKAGES}" \
            --excludePrivatePackages

  storefront-check:
    if: always()
    needs:
      - markdown-only-changes
      - lint
      - lint-admin-modules
      - jest
      - vitest
      - license-check
      - twig-lint-storefront

    runs-on: Ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          # allowed-failures: docs, linters
          allowed-skips: ${{ needs.markdown-only-changes.outputs.docs_only == 'true' && 'lint, lint-admin-modules, jest, vitest, license-check, twig-lint-storefront' || '' }}
          jobs: ${{ toJSON(needs) }}
