name: Reproduce Issue

# Hand-written orchestrator for the bug-reproduction pipeline.
#
#   gate ─▶ analyze ─▶ build-repro ─▶ reproduce (matrix: reported ‖ trunk, parallel) ─▶ report
#
# Status: analyze = config-only claude-code-action agent; build-repro = live-instance
# agent that creates + self-verifies the executable bundle; reproduce = real provision
# + deterministic executor for all three layers (http / playwright / direct). All JSON conforms to
# the JSON contracts in .claude/skills/reproduce/references/ (ANALYZE.md, BUILD.md).

on:
  issues:
    types: [labeled] # initial trigger: apply the `ci:reproduce` label
  issue_comment:
    types: [created] # initial trigger: comment `/reproduce`
  workflow_dispatch: # on-demand run (BOTH legs by default; opt into trunk-only via skip_reported)
    inputs:
      issue_number:
        description: "Issue number to reproduce"
        required: true
        type: number
      skip_reported:
        description: "Re-check trunk only (skip the reported-version leg)"
        required: false
        default: false
        type: boolean
      post_comment:
        description: "Post the result as an issue comment (otherwise job summary only)"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "DEMO: skip the Analyze agent and emit a canned plan (smoke-test the wiring without an API key, $0)"
        required: false
        default: false
        type: boolean
      demo_layer:
        description: "DEMO (dry_run only): which executor to smoke-test end-to-end"
        required: false
        default: "http"
        type: choice
        options: [http, direct, playwright]
      branch:
        description: "Branch/ref the trunk leg reproduces against (defaults to trunk)"
        required: false
        default: "trunk"
        type: string
      max_turns:
        description: "Cap on the Build Repro agent's turns (cost control; default 30). Analyze is fixed-low (6, classification only)."
        required: false
        default: "30"
        type: string

concurrency:
  group: reproduce-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  # shopware/setup-shopware pulls node20 sub-actions (runs-on/action, setup-php, cache,
  # checkout@v4); force them onto node24 to silence the deprecation warning we don't own.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  issues: write # comment + label, guarded by the gate job

jobs:
  # --------------------------------------------------------------------------
  # Decide whether to run, who is allowed, and which issue. One source of truth
  # for downstream `if:` guards.
  # --------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.decide.outputs.run }}
      issue: ${{ steps.decide.outputs.issue }}
      is_manual: ${{ steps.decide.outputs.is_manual }}
      post: ${{ steps.decide.outputs.post }}
      skip_reported: ${{ steps.decide.outputs.skip_reported }}
      needs_info: ${{ steps.decide.outputs.needs_info }}
    steps:
      - name: Decide run / authz / issue
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LABEL = 'ci:reproduce';
            const CMD = '/reproduce';
            const TRUSTED = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const ev = context.eventName;
            let run = false, issue = '', isManual = false, post = false, skipReported = false;

            if (ev === 'workflow_dispatch') {
              // dispatch already requires write access → trusted. Runs BOTH legs unless
              // skip_reported is set (then it's a trunk-only re-check).
              run = true;
              isManual = true;
              skipReported = String(context.payload.inputs.skip_reported) === 'true';
              issue = String(context.payload.inputs.issue_number);
              post = String(context.payload.inputs.post_comment) === 'true';
            } else if (ev === 'issues' && context.payload.action === 'labeled') {
              // only collaborators can apply labels → the label itself is the authz.
              if (context.payload.label && context.payload.label.name === LABEL) {
                run = true; post = true; // labeling an issue should post the verdict
                issue = String(context.payload.issue.number);
              }
            } else if (ev === 'issue_comment' && context.payload.action === 'created') {
              const c = context.payload.comment;
              const onIssue = !context.payload.issue.pull_request; // issues only, not PRs
              const body = (c.body || '').trim();
              if (onIssue && body.startsWith(CMD) && TRUSTED.includes(c.author_association)) {
                run = true; post = true; // /reproduce should post the verdict
                issue = String(context.payload.issue.number);
              }
            }

            // Dumb pre-check (no agent): the issue must have usable reproduction steps.
            // The current Shopware bug template renders "How to reproduce"; older issues
            // (and other projects) use "Steps to reproduce" — accept either heading.
            // If neither carries content, ask for them and abort — don't spend an
            // agent/provision on a vague issue.
            let needsInfo = false;
            if (run && issue) {
              const { owner, repo } = context.repo;
              let body = '';
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: Number(issue) });
                body = data.body || '';
              } catch (e) { core.warning('could not fetch issue body: ' + e.message); }
              const m = body.match(/(?:how to reproduce|steps to reproduce)[:\s]*([\s\S]*?)(?=\n\s*#{1,6}\s|$)/i);
              const steps = m ? m[1].replace(/[\s>*#-]/g, ' ').trim() : '';
              if (steps.length < 15) {
                needsInfo = true; run = false;
                core.warning('no usable reproduction steps ("How to reproduce" / "Steps to reproduce") — requesting info, aborting');
                if (post) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: Number(issue),
                    body: "## Reproduction — needs info\n\nI couldn't find usable reproduction steps (the **How to reproduce** section) in this issue. Please add a clear, numbered reproduction and the affected Shopware version, then re-apply the `ci:reproduce` label." });
                }
              }
            }

            core.setOutput('run', String(run));
            core.setOutput('issue', issue);
            core.setOutput('is_manual', String(isManual));
            core.setOutput('post', String(post));
            core.setOutput('skip_reported', String(skipReported));
            core.setOutput('needs_info', String(needsInfo));
            core.info(`event=${ev} run=${run} issue=${issue} manual=${isManual} post=${post} skip_reported=${skipReported} needs_info=${needsInfo}`);

  # --------------------------------------------------------------------------
  # Analyze: emit config-only analysis.json and the target matrix.
  # The matrix encodes BOTH dedup (reported == trunk) and "not on manual rerun".
  # --------------------------------------------------------------------------
  analyze:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the agent reads the issue + fix-PR test + schema
    permissions:
      contents: read # checkout
      issues: write # the matrix step (bin/matrix.sh) posts needs_info / low-confidence comments; the agent only reads
      id-token: write # claude-code-action fetches a GitHub token via OIDC
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      # Codebase available so the agent can read the DAL schema + the fix PR's test.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Decide the mode ONCE. Never silently fabricate: missing key + not dry-run = fail.
      - name: Select mode (dry-run / real / fail)
        id: mode
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          HAS_KEY: ${{ secrets.QUALITY_INITIATIVE_ANTHROPIC_API_KEY != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then m=dry_run
          elif [ "$HAS_KEY" = "true" ]; then m=real
          else m=fail; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "analyze mode: $m"

      # Production safety: no key and not an explicit demo → fail loud, BEFORE provisioning.
      - name: Guard — refuse to fabricate
        if: steps.mode.outputs.mode == 'fail'
        run: |
          echo "::error::Analyze requires QUALITY_INITIATIVE_ANTHROPIC_API_KEY (or ANTHROPIC_API_KEY). Refusing to emit a fabricated plan."
          echo "::error::Set the secret, or dispatch with dry_run=true for a clearly-labelled demo."
          exit 1

      # Real Analyze agent. Emits config-only analysis.json per references/ANALYZE.md.
      # Prefetch the issue + (best-effort) the linked fix PR's diff with cheap gh calls,
      # then concatenate the runbook + schema + issue into ONE analyze-context.md so the
      # agent reads ONE file instead of spending turns ($) fetching/exploring.
      - name: Prefetch context
        id: ctx
        if: steps.mode.outputs.mode == 'real'
        env:
          ISSUE: ${{ needs.gate.outputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/actions/repro/bin/prefetch.sh
          bash .github/actions/repro/bin/analyze-context.sh
          # Inject the assembled context as the prompt itself → the agent starts with it in
          # context, saving the one Read of analyze-context.md (screenshots are still Read-ed).
          { echo 'prompt<<CONTEXT_EOF'; cat analyze-context.md; echo CONTEXT_EOF; } >> "$GITHUB_OUTPUT"

      - name: Analyze (agent)
        id: analyze
        if: steps.mode.outputs.mode == 'real'
        # Hitting --max-turns is a hard error in the action; tolerate it so a
        # complete analysis.json (written before the cap) still counts. The matrix
        # step fails cleanly if no analysis.json was produced.
        continue-on-error: true
        uses: anthropics/claude-code-action@11ba60486e4aec9ddfeafcf4bb3f00b028ac2c16 # v1.0.142
        with:
          anthropic_api_key: ${{ secrets.QUALITY_INITIATIVE_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          # Use the default token so the action skips the Claude GitHub App token
          # exchange (the App is installed on shopware/shopware, but not everywhere).
          github_token: ${{ github.token }}
          # Analyze is a CLASSIFICATION, not an exploration. All context is in one file and
          # the toolset below is Read+Write ONLY — so the agent literally cannot explore; it
          # reads the context (+ any screenshots), then writes the plan. This is the cost
          # collapse: ~1 Read + 1 Write instead of a 40-turn search.
          # The full assembled context IS the prompt (injected by the Prefetch step) — no
          # "read the file" round-trip. Instructions are maintained in analyze-context.md
          # (prompts/analyze-context.tpl.md + the references). One place to edit.
          prompt: ${{ steps.ctx.outputs.prompt }}
          # Sonnet (bounded task). Hard-cap turns LOW: there is nothing to explore, so this is
          # a ceiling for read-context + read-images + write, not a search budget. Read+Write
          # only — no Bash/Grep/Glob means exploration is impossible, not merely discouraged.
          claude_args: >-
            --model claude-sonnet-4-6 --max-turns 6
            --allowedTools "Read,Write"

      # DEMO only: canned plan, reached solely via dry_run=true.
      # DEMO: a canned plan per layer so the WHOLE pipeline (provision → executor → verdict
      # → report) can be smoke-tested for $0 — no agent, no API key. confidence is 1.0 so the
      # < 0.4 bail-out doesn't suppress the run; derived_from + the ::warning:: mark it fake.
      - name: Analyze (dry-run demo)
        if: steps.mode.outputs.mode == 'dry_run'
        env:
          ISSUE: ${{ needs.gate.outputs.issue }}
          DEMO_LAYER: ${{ github.event.inputs.demo_layer || 'http' }}
        run: bash .github/actions/repro/bin/demo-plan.sh

      # Capture the agent transcript (tool calls, denials, per-turn breakdown) for cost
      # analysis. Fork/dev only — gate behind debug before the real shopware PR (tool
      # outputs can be sensitive on a public repo).
      - name: Upload agent transcript (debug)
        if: always() && steps.analyze.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analyze-transcript
          path: ${{ steps.analyze.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Agent cost telemetry
        if: always() && steps.analyze.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.analyze.outputs.execution_file }}
          PHASE: analyze
        run: bash .github/actions/repro/bin/agent-telemetry.sh

      # Compute the target matrix from the produced analysis (dedup + not-on-manual-rerun).
      # Leg matrix + the three graceful pre-provision exits (missing plan / needs_info /
      # < 0.4 low confidence) — see bin/matrix.sh.
      - name: Compute target matrix
        id: matrix
        env:
          SKIP_REPORTED: ${{ needs.gate.outputs.skip_reported }}
          BRANCH: ${{ github.event.inputs.branch || 'trunk' }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          POST: ${{ needs.gate.outputs.post }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/repro/bin/matrix.sh
      # Gate on the file existing: matrix.sh deliberately turns "no analysis.json" into a
      # graceful empty-matrix skip (agent error / turn budget), so the upload must NOT
      # re-redden that run with if-no-files-found: error.
      - name: Upload analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('analysis.json') != ''
        with:
          name: analysis
          path: analysis.json
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  # Build Repro: one live shop + agentic artifact authoring. The output is an
  # executable repro bundle (`repro-plan.json` + optional fixtures/scripts) that is
  # self-verified before the version matrix runs.
  # --------------------------------------------------------------------------
  build-repro:
    needs: [gate, analyze]
    if: needs.gate.outputs.run == 'true' && needs.analyze.outputs.targets != '[]' && needs.analyze.outputs.targets != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download analysis
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: analysis

      - name: Read build plan from analysis
        id: buildplan
        run: |
          set -euo pipefail
          version=$(jq -r '.version' analysis.json)
          echo "version=v${version}" >> "$GITHUB_OUTPUT"
          echo "executor=$(jq -r '.executor' analysis.json)" >> "$GITHUB_OUTPUT"
          echo "admin_build=$(jq -r '.build_profile.admin_build' analysis.json)" >> "$GITHUB_OUTPUT"
          echo "storefront_build=$(jq -r '.build_profile.storefront_build' analysis.json)" >> "$GITHUB_OUTPUT"

      - name: Provision builder shop
        id: provision
        uses: ./.github/actions/repro/provision
        with:
          version: ${{ steps.buildplan.outputs.version }}
          admin-build: ${{ steps.buildplan.outputs.admin_build }}
          storefront-build: ${{ steps.buildplan.outputs.storefront_build }}

      # Snapshot the clean DB so build-verify can reset to it before every seed attempt
      # (each iteration starts fresh → re-seeds never collide with a prior attempt's rows).
      - name: Snapshot clean DB
        run: bash .github/actions/repro/bin/db-snapshot.sh

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Install Playwright
        if: steps.buildplan.outputs.executor == 'playwright'
        run: |
          npm init -y >/dev/null
          npm i -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Select mode (dry-run / real / fail)
        id: mode
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          HAS_KEY: ${{ secrets.QUALITY_INITIATIVE_ANTHROPIC_API_KEY != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then m=dry_run
          elif [ "$HAS_KEY" = "true" ]; then m=real
          else m=fail; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "build mode: $m"

      - name: Guard — refuse to fabricate
        if: steps.mode.outputs.mode == 'fail'
        run: |
          echo "::error::Build Repro requires QUALITY_INITIATIVE_ANTHROPIC_API_KEY (or ANTHROPIC_API_KEY). Refusing to emit a fabricated repro bundle."
          echo "::error::Set the secret, or dispatch with dry_run=true for a clearly-labelled demo."
          exit 1

      - name: Prefetch context
        id: ctx
        if: steps.mode.outputs.mode == 'real'
        env:
          ISSUE: ${{ needs.gate.outputs.issue }}
          GH_TOKEN: ${{ github.token }}
          MAX_TURNS: ${{ github.event.inputs.max_turns || '30' }} # filled into the build-context turn budget
        run: |
          bash .github/actions/repro/bin/prefetch.sh
          bash .github/actions/repro/bin/build-context.sh
          # Inject the assembled context as the prompt itself → the agent starts with it in
          # context, saving the one Read of build-context.md (screenshots are still Read-ed).
          { echo 'prompt<<CONTEXT_EOF'; cat build-context.md; echo CONTEXT_EOF; } >> "$GITHUB_OUTPUT"

      - name: Build Repro (agent)
        id: build_agent
        if: steps.mode.outputs.mode == 'real'
        continue-on-error: true
        uses: anthropics/claude-code-action@11ba60486e4aec9ddfeafcf4bb3f00b028ac2c16 # v1.0.142
        with:
          anthropic_api_key: ${{ secrets.QUALITY_INITIATIVE_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # The full assembled context IS the prompt (injected by the Prefetch step) — no
          # "read the file" round-trip. All instructions (turn budget, allowed commands,
          # two-phase discipline, fixtures rules) are maintained in build-context.md, assembled
          # from prompts/build-context.tpl.md + the references. One place to edit.
          prompt: ${{ steps.ctx.outputs.prompt }}
          # Search tools (Glob/Grep/rg/grep/find) ARE allowed: a TARGETED lookup (find the exact
          # template/field/selector) is what let the cheap one-shot author succeed. The failure
          # mode is the open-ended investigation LOOP, which the prompt bounds (author once →
          # verify once → one fix or STOP), not the toolset. Task/Agent disabled: a sub-agent is an
          # unbounded source-diving expedition hidden in one turn (a real 25-call waste). Edit
          # disabled: the agent only ever rewrites its OWN generated files, and it wasted turns
          # fighting Edit's exact-match on JSON/TS — Write (full rewrite) is the one way.
          claude_args: >-
            --model claude-sonnet-4-6 --max-turns ${{ github.event.inputs.max_turns || '30' }}
            --disallowedTools "Task,Agent,Edit"
            --allowedTools "Read,Glob,Grep,Write,Bash(rg:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*),Bash(cat:*),Bash(ls:*),Bash(find:*),Bash(jq:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(sed:*),Bash(wc:*),Bash(bash .github/actions/repro/bin/build-verify.sh:*),Bash(bash .github/actions/repro/bin/shop-get.sh:*),Bash(npm init:*),Bash(npm i:*),Bash(npm install:*),Bash(npx playwright install:*),Bash(cp:*),Bash(mkdir:*)"
        env:
          APP_URL: ${{ steps.provision.outputs.app_url }}
          SW_ACCESS_KEY: ${{ steps.provision.outputs.access_key }}
          ADMIN_USER: admin
          ADMIN_PASS: shopware
          DATABASE_URL: ${{ env.DATABASE_URL }} # build-verify resets the DB to the clean snapshot before each seed

      - name: Upload build agent transcript (debug)
        if: always() && steps.build_agent.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-repro-transcript
          path: ${{ steps.build_agent.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Agent cost telemetry
        if: always() && steps.build_agent.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.build_agent.outputs.execution_file }}
          PHASE: build-repro
        run: bash .github/actions/repro/bin/agent-telemetry.sh

      - name: Build Repro (dry-run demo)
        if: steps.mode.outputs.mode == 'dry_run'
        env:
          DEMO_LAYER: ${{ github.event.inputs.demo_layer || 'http' }}
        run: bash .github/actions/repro/bin/demo-build.sh

      # Safety net: the agent is SUPPOSED to self-verify (so it can iterate on failures), but
      # if its session ended without a builder-result.json (ran out of turns, forgot, died)
      # yet it DID author a plan, run the same deterministic verification here so a salvageable
      # bundle isn't lost to an opaque "missing" failure. The shop is still up in this job. No
      # agent turns spent. If the agent already verified, this is skipped.
      - name: Verify built bundle (fallback)
        if: steps.mode.outputs.mode == 'real' && hashFiles('repro-plan.json') != '' && hashFiles('builder-result.json') == ''
        env:
          APP_URL: ${{ steps.provision.outputs.app_url }}
          SW_ACCESS_KEY: ${{ steps.provision.outputs.access_key }}
          ADMIN_USER: admin
          ADMIN_PASS: shopware
          DATABASE_URL: ${{ env.DATABASE_URL }} # build-verify resets the DB to the clean snapshot before each seed
        run: bash .github/actions/repro/bin/build-verify.sh

      - name: Check built repro bundle
        run: bash .github/actions/repro/bin/build-check.sh

      - name: Upload repro bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repro-plan
          path: |
            repro-plan.json
            builder-result.json
            fixtures.json
            repro.sh
            repro.spec.ts
            ReproTest.php
            phpunit-output.txt
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Reproduce: one parallel leg per target. fail-fast:false so one dead leg
  # never kills the other. Executor is chosen by repro-plan.json.
  # --------------------------------------------------------------------------
  reproduce:
    needs: [gate, analyze, build-repro]
    # Skip cleanly (don't fail the run) when there are no targets — analyze emitted an
    # empty matrix for needs_info or a < 0.4 low-confidence bail-out. An empty fromJSON('[]')
    # matrix would otherwise error on expansion and turn a correct no-op run red.
    if: needs.gate.outputs.run == 'true' && needs.analyze.outputs.targets != '[]' && needs.analyze.outputs.targets != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No explicit name: the matrix is a list of version strings, so GitHub's default
    # label is "reproduce (6.7.9.0)" when it runs and a clean "reproduce" when skipped
    # (an explicit name template would render the raw ${{ }} on a skipped matrix job).
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.analyze.outputs.targets) }}
    steps:
      # repro tooling (this workflow's repo) at root; the shop is installed under ./shop
      # so setup-shopware's checkout never clobbers repro-plan.json or the scripts.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download repro bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repro-plan
      - name: Derive leg parameters
        id: plan
        env:
          LEG_VERSION: ${{ matrix.version }}
          BRANCH: ${{ github.event.inputs.branch || 'trunk' }}
        run: REPRO_PLAN=repro-plan.json bash .github/actions/repro/bin/leg-plan.sh

      # All three executors need a provisioned shop: http/playwright hit it over HTTP, direct
      # runs PHPUnit against the installed kernel + DB. Build only the surface the layer needs.
      # continue-on-error: a dead env blocks THIS leg, it must not kill the run (the other leg + report still go).
      - name: Provision shop
        id: provision
        if: steps.plan.outputs.executor == 'http' || steps.plan.outputs.executor == 'playwright' || steps.plan.outputs.executor == 'direct'
        continue-on-error: true
        uses: ./.github/actions/repro/provision
        with:
          version: ${{ steps.plan.outputs.version }}
          admin-build: ${{ steps.plan.outputs.admin_build }}
          storefront-build: ${{ steps.plan.outputs.storefront_build }}

      # Seed exactly the entities the plan needs (admin sync, demodata:false).
      # No-ops when the plan ships no fixtures.json. Runs once per leg, before the executor.
      - name: Seed fixtures
        id: seed
        if: steps.provision.outcome == 'success'
        continue-on-error: true
        env:
          APP_URL: ${{ steps.provision.outputs.app_url }}
        run: PAYLOAD=fixtures.json bash .github/actions/repro/bin/seed.sh

      # Playwright legs need node + the browser (gated; http/direct skip this cost).
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.plan.outputs.executor == 'playwright' && steps.provision.outcome == 'success' && steps.seed.outcome == 'success'
        with:
          node-version: 22
      - name: Install Playwright
        if: steps.plan.outputs.executor == 'playwright' && steps.provision.outcome == 'success' && steps.seed.outcome == 'success'
        run: |
          npm init -y >/dev/null
          npm i -D @playwright/test
          npx playwright install --with-deps chromium

      # Dead env (provision or seed failed) → emit a blocked result for this leg, skip the executor.
      - name: Mark leg blocked
        if: steps.provision.outcome == 'failure' || steps.seed.outcome == 'failure'
        env:
          TARGET: ${{ steps.plan.outputs.role }}
          FAILED: ${{ steps.seed.outcome == 'failure' && 'seed' || 'provision' }}
          REPRO_PLAN: repro-plan.json
        run: bash .github/actions/repro/bin/leg-blocked.sh

      - name: Run executor
        if: steps.provision.outcome != 'failure' && steps.seed.outcome != 'failure'
        env:
          TARGET: ${{ steps.plan.outputs.role }}
          EXECUTOR: ${{ steps.plan.outputs.executor }}
          REPRO_PLAN: repro-plan.json
          APP_URL: ${{ steps.provision.outputs.app_url }}
          SW_ACCESS_KEY: ${{ steps.provision.outputs.access_key }}
        run: bash .github/actions/repro/bin/run-leg.sh
      - name: Upload leg evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() # capture evidence even when a leg fails
        with:
          name: repro-${{ steps.plan.outputs.role }}
          path: |
            result.json
            seed-error.txt
            repro.sh
            repro.spec.ts
            ReproTest.php
            phpunit-output.txt
            test-results/
            playwright-report/
          if-no-files-found: ignore # script + phpunit-output.txt + test-results/ + playwright-report/ vary by executor
          retention-days: 7

      # A seed failure is a PLAN defect (fixtures invalid on a freshly-provisioned instance —
      # e.g. a hardcoded install id), NOT env flakiness, so surface it as a RED run rather than
      # a silent blocked-but-green. Runs LAST so the blocked result.json + seed-error evidence
      # were already written + uploaded above (and any cleanup ran). Provision failures stay
      # degraded (blocked, not red) — those are env, not the bundle.
      - name: Fail leg if seeding failed
        if: steps.seed.outcome == 'failure'
        run: |
          echo "::error::Seeding failed for the ${{ steps.plan.outputs.role }} leg — the repro bundle's fixtures are not valid on a freshly-provisioned instance (see the 'Seed fixtures' step / the seed-error in the repro-${{ steps.plan.outputs.role }} artifact)."
          exit 1

  # --------------------------------------------------------------------------
  # Verdict: deterministic decision from leg statuses + Analyze confidence. No agent.
  # --------------------------------------------------------------------------
  verdict:
    needs: [gate, analyze, build-repro, reproduce]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      has_results: ${{ steps.v.outputs.has_results }}
      verdict: ${{ steps.v.outputs.verdict }}
      reported: ${{ steps.v.outputs.reported }}
      trunk: ${{ steps.v.outputs.trunk }}
      fix_candidate: ${{ steps.v.outputs.fix_candidate }}
      unsure_reason: ${{ steps.v.outputs.unsure_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      # Shared, mode-parameterized verdict map (see bin/verdict.sh). Emits has_results,
      # reported, trunk, verdict, fix_candidate, unsure_reason to the step outputs.
      - name: Compute verdict
        id: v
        run: MODE=reproduce ART=artifacts bash .github/actions/repro/bin/verdict.sh

  # --------------------------------------------------------------------------
  # Attribute (AGENT, gated): on a diverging verdict, name the commit that fixed
  # or introduced the symptom. Only runs for regression, or fixed_on_trunk with no
  # known fix PR. Enrichment only — skips (does not fail) when no API key.
  # --------------------------------------------------------------------------
  attribute:
    needs: [gate, analyze, build-repro, reproduce, verdict]
    if: >
      always() && needs.gate.outputs.run == 'true' && needs.verdict.outputs.has_results == 'true' &&
      ( needs.verdict.outputs.verdict == 'regression' ||
        ( needs.verdict.outputs.verdict == 'fixed_on_trunk' && needs.verdict.outputs.fix_candidate == '' ) )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # full history for the git log range
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0 # need v<reported>..trunk history + tags
      - name: Download repro bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repro-plan
      - name: Detect API key
        id: mode
        env:
          HAS_KEY: ${{ secrets.QUALITY_INITIATIVE_ANTHROPIC_API_KEY != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: echo "real=$HAS_KEY" >> "$GITHUB_OUTPUT"
      # Fill prompts/attribute.md (placeholders → values) into a multiline step output, so the
      # prompt text is maintained in one file, not inline here.
      - name: Build attribution prompt
        id: attr_prompt
        if: steps.mode.outputs.real == 'true'
        env:
          ISSUE: ${{ needs.gate.outputs.issue }}
          VERDICT: ${{ needs.verdict.outputs.verdict }}
        run: |
          if [ "$VERDICT" = regression ]; then KIND=regression; ACTION=INTRODUCED; else KIND=fix; ACTION=FIXED; fi
          {
            echo 'text<<PROMPT_EOF'
            sed -e "s/{{ISSUE}}/$ISSUE/g" -e "s/{{VERDICT}}/$VERDICT/g" -e "s/{{KIND}}/$KIND/g" -e "s/{{ACTION}}/$ACTION/g" \
              .github/actions/repro/prompts/attribute.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Attribute (agent)
        if: steps.mode.outputs.real == 'true'
        continue-on-error: true # enrichment only — a failed attribution must not red the run
        uses: anthropics/claude-code-action@11ba60486e4aec9ddfeafcf4bb3f00b028ac2c16 # v1.0.142
        with:
          anthropic_api_key: ${{ secrets.QUALITY_INITIATIVE_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-sonnet-4-6 --max-turns 20
            --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(rg:*),Bash(cat:*),Bash(ls:*),Bash(jq:*)"
          prompt: ${{ steps.attr_prompt.outputs.text }}
      - name: Skipped (no key)
        if: steps.mode.outputs.real != 'true'
        run: echo "::warning::No API key — skipping commit attribution (enrichment only)."
      # report.sh renders attribution.likely_commit into the PUBLIC comment. Validate the
      # shape first (kind + a real 7–40 hex sha) and DROP the file if the agent produced
      # junk/hallucinated it — a missing file degrades cleanly (report just omits the line),
      # a malformed one would post a confident wrong sha.
      - name: Validate attribution
        if: hashFiles('attribution.json') != ''
        run: |
          if ! jq -e '(.kind|test("^(regression|fix)$")) and (.likely_commit|test("^[0-9a-f]{7,40}$"))' attribution.json >/dev/null 2>&1; then
            echo "::warning::attribution.json failed validation (kind/likely_commit) — dropping it (enrichment only)."
            rm -f attribution.json
          fi
      - name: Upload attribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('attribution.json') != ''
        with:
          name: attribution
          path: attribution.json
          retention-days: 7

  # --------------------------------------------------------------------------
  # Report: render a self-contained comment from the verdict + per-leg evidence
  # + (optional) attribution. No agent. Posts only when a result exists.
  # --------------------------------------------------------------------------
  report:
    needs: [gate, analyze, build-repro, reproduce, verdict, attribute]
    if: always() && needs.gate.outputs.run == 'true' && needs.verdict.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # post the comment
      contents: write # push inline evidence (gated by vars.REPRO_EVIDENCE_BRANCH)
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      # Shared, mode-parameterized renderer (see bin/report.sh): writes comment.md and the
      # collapsible job summary, with the script dedup + playwright HTML-report pointer.
      - name: Render comment + summary
        id: render
        env:
          MODE: reproduce
          ISSUE: ${{ needs.gate.outputs.issue }}
          VERDICT: ${{ needs.verdict.outputs.verdict }}
          FIX: ${{ needs.verdict.outputs.fix_candidate }}
          UNSURE: ${{ needs.verdict.outputs.unsure_reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/actions/repro/bin/report.sh

      # Inline evidence (playwright legs): publish the leg screenshot(s) to an orphan evidence
      # branch and embed them in the comment — comments can't host real video (no attachments
      # API), but images render inline and PERSIST past artifact expiry. Full video/trace/HTML
      # report stay in the artifacts. On by default (branch `ci/repro-evidence`, override with
      # the REPRO_EVIDENCE_BRANCH repo variable); no-op for non-playwright legs; never fails.
      - name: Embed inline evidence
        if: needs.gate.outputs.post == 'true' && needs.verdict.outputs.verdict != 'blocked'
        continue-on-error: true
        env:
          BRANCH: ${{ vars.REPRO_EVIDENCE_BRANCH || 'ci/repro-evidence' }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TOKEN: ${{ github.token }}
        run: bash .github/actions/repro/bin/embed-evidence.sh

      - name: Post comment
        # 'blocked' = the repro env/seed failed (infra), not a bug verdict → keep it in the
        # job summary, don't post public noise on the issue. Real verdicts still post.
        if: needs.gate.outputs.post == 'true' && needs.verdict.outputs.verdict != 'blocked'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # GitHub's API intermittently returns transient 401s; github-script exempts 401
          # from retries by default, which failed an otherwise-green run. Un-exempt it.
          retries: 3
          retry-exempt-status-codes: 400,403,404,422
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.gate.outputs.issue }}'),
              body: fs.readFileSync('comment.md', 'utf8'),
            });
