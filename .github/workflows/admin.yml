name: Admin checks and tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      extension-tooling-e2e:
        description: "Run the slow extension-tooling e2e suite (otherwise nightly only)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      extension-tooling-e2e:
        description: "Run the slow extension-tooling e2e suite (otherwise nightly only)"
        type: boolean
        default: false

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  COMPOSER_ROOT_VERSION: 6.7.9999999-dev

permissions:
  contents: read

jobs:
  markdown-only-changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        uses: ./.github/actions/markdown-only-changes

  lint:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Setup JS workspace
        uses: ./.github/actions/setup-js-workspace
        with:
          build-dependencies-of: administration

      - name: Generate entity schema types
        run: composer run admin:generate-entity-schema-types

      - name: Generate unit test setup artifacts
        run: pnpm --dir packages/administration run unit-setup

      - name: Cache ESLint and Stylelint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/administration/node_modules/.eslintcache
            packages/administration/node_modules/.stylelintcache
          key: admin-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/administration/eslint.config.ts', 'packages/administration/.stylelintrc') }}

      - name: Lint
        working-directory: packages/administration
        run: pnpm run lint
      - name: Lint types
        working-directory: packages/administration
        run: pnpm run lint:types
      - name: Lint scss
        working-directory: packages/administration
        run: pnpm run lint:scss
      - name: Format
        working-directory: packages/administration
        run: pnpm run format

  admin:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    name: "Jest Admin (unit)"
    env:
      NODE_VERSION: 'lts/*'
      JEST_MAX_WORKERS: 100%

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Generate entity schema mock
        run: composer run framework:schema:dump

      - name: Setup JS workspace
        uses: ./.github/actions/setup-js-workspace
        with:
          build-dependencies-of: administration

      - name: Generate unit test setup artifacts
        run: pnpm --dir packages/administration run unit-setup

      - name: Run Jest Admin unit
        run: pnpm --dir packages/administration run unit --silent

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: build/artifacts/jest/cobertura-coverage.xml
          flags: jest-admin
          disable_search: true
          disable_file_fixes: true

  extension-tooling-e2e:
    needs:
      - markdown-only-changes
    # Slow suite: scaffolds a project and runs the real vue-tsc/ESLint toolchain.
    # Nightly passes the input to enable it; it does not run on pull requests.
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' && inputs.extension-tooling-e2e }}
    runs-on: ubuntu-24.04
    name: "Extension tooling e2e (nightly)"
    env:
      NODE_VERSION: 'lts/*'

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Generate entity schema mock
        run: composer run framework:schema:dump

      - name: Setup JS workspace
        uses: ./.github/actions/setup-js-workspace
        with:
          build-dependencies-of: administration

      - name: Generate unit test setup artifacts
        run: pnpm --dir packages/administration run unit-setup

      - name: Run extension tooling e2e suite
        run: pnpm --dir packages/administration run unit:extension-tooling-e2e

  license-check:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    name: "License check"
    env:
      WHITELISTED_JS_PACKAGES: 'abab@2.0.1;administration;taffydb@2.6.2'
      NODE_VERSION: 'lts/*'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JS workspace
        uses: ./.github/actions/setup-js-workspace
      - name: Check license
        working-directory: packages/administration
        run: |
          npx license-checker-rseidelsohn \
            --onlyAllow "$(tr \\n \; < ${{ github.workspace }}/.allowed-licenses)" \
            --excludePackages "${WHITELISTED_JS_PACKAGES}" \
            --excludePrivatePackages

  admin-check:
    if: always()
    needs:
      - markdown-only-changes
      - lint
      - admin
      - license-check

    runs-on: Ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          # allowed-failures: docs, linters
          allowed-skips: ${{ needs.markdown-only-changes.outputs.docs_only == 'true' && 'lint, admin, license-check' || '' }}
          jobs: ${{ toJSON(needs) }}
